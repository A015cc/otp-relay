<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OTP Relay</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      width: 360px;
      margin: 0;
      padding: 16px;
      background: #0f1115;
      color: #e6e8ee;
      font: 13px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    header strong { font-size: 14px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; flex: none; }
    .dot.on { background: #34d399; box-shadow: 0 0 0 3px rgba(52, 211, 153, .15); }
    .dot.off { background: #f59e0b; }
    .state { margin-left: auto; color: #9aa3b2; font-size: 12px; }
    .latest {
      background: #171a21;
      border: 1px solid #272b35;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }
    .latest .label { color: #9aa3b2; font-size: 11px; margin-bottom: 4px; }
    .codeRow { display: flex; align-items: center; gap: 10px; }
    .codeRow code {
      font: 600 20px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: 2px;
      color: #a7f3d0;
    }
    .codeRow button { margin-left: auto; }
    label { display: block; margin-bottom: 10px; color: #9aa3b2; font-size: 12px; }
    label span { display: block; margin-bottom: 4px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #2b303b;
      background: #141821;
      color: #e6e8ee;
      font: 13px ui-monospace, SFMono-Regular, Consolas, monospace;
      outline: none;
    }
    input[type="text"]:focus, input[type="password"]:focus { border-color: #3b82f6; }
    .row { display: flex; gap: 8px; margin-top: 4px; }
    button {
      border: 1px solid #2b303b;
      background: #1d2432;
      color: #e6e8ee;
      border-radius: 8px;
      padding: 7px 12px;
      font: 13px system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      cursor: pointer;
    }
    button:hover { background: #253047; }
    button.primary { background: #2563eb; border-color: #2563eb; }
    button.primary:hover { background: #1d4ed8; }
    button.ghost { background: transparent; }
    button:disabled { opacity: .55; cursor: default; }
    .msg { min-height: 18px; margin: 10px 0 0; font-size: 12px; color: #9aa3b2; }
    .msg.ok { color: #34d399; }
    .msg.err { color: #f87171; }
    .hint { margin: 12px 0 0; color: #6b7280; font-size: 11px; line-height: 1.6; }
    .toggle { display: flex; align-items: center; gap: 8px; margin: 2px 0 12px; color: #9aa3b2; }
    .toggle input { accent-color: #2563eb; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <span id="dot" class="dot"></span>
    <strong>OTP Relay</strong>
    <span id="state" class="state">读取中…</span>
  </header>

  <section id="latestBox" class="latest" hidden>
    <div class="label">最近收到的验证码</div>
    <div class="codeRow">
      <code id="latestCode"></code>
      <button id="copyBtn" class="ghost">复制</button>
    </div>
  </section>

  <label>
    <span>NAS 地址</span>
    <input id="serverUrl" type="text" placeholder="http://192.168.1.10:8099" autocomplete="off" spellcheck="false" />
  </label>

  <label>
    <span>访问令牌（OTP_TOKEN）</span>
    <input id="token" type="password" placeholder="与 docker-compose 中的令牌一致" autocomplete="off" spellcheck="false" />
  </label>

  <div class="toggle">
    <input id="enabled" type="checkbox" checked />
    <label for="enabled" style="margin:0">启用自动填充</label>
  </div>

  <div class="row">
    <button id="saveBtn" class="primary">保存并连接</button>
    <button id="testBtn" class="ghost">测试连接</button>
  </div>

  <p id="msg" class="msg"></p>
  <p class="hint">
    在 iPhone 快捷指令里把验证码 POST 到 <code>/api/code</code>，本扩展会把最新验证码填进当前页面的输入框。
    没找到输入框时会弹一个可点击复制的提示。
  </p>

  <script src="popup.js"></script>
</body>
</html>
