services:
  otp-relay:
    # 官方 Bun 镜像，免构建；绿联 UGOS Pro 的 Docker「项目」可直接用。
    image: oven/bun:1-alpine
    container_name: otp-relay
    restart: unless-stopped
    working_dir: /app
    command: ["bun", "/app/server.js"]
    ports:
      - "8099:8099"
    environment:
      # 生成方式见 README；至少 16 位。
      OTP_TOKEN: "replace-with-a-long-random-token"
      OTP_TTL_SECONDS: "180"
    volumes:
      # Compose 文件同目录下的 server.js
      - ./server.js:/app/server.js:ro

# 想自己构建镜像的话，把上面 image/command/volumes 换掉，改用：
#   build: .
# 然后 docker compose up -d --build
